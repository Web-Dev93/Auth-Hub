kind = "web"
previewPath = "/"
title = "AuthHub"
description = "A centralized authentication hub for managing user logins across multiple websites. Features Google OAuth, user profiling, multi-app management with per-app login panels, admin dashboard, and progressive verification nudges. Admins create login panels for each site, configure which providers are enabled, and get embed codes. All user data flows into one database with rich profiles."
version = "1.0.0"
id = "artifacts/authhub"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20713

[services.development]
run = "pnpm --filter @workspace/authhub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/authhub", "run", "build" ]
serve = "static"
publicDir = "artifacts/authhub/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20713"
BASE_PATH = "/"
